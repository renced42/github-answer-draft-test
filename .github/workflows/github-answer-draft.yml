name: GitHub választervezet emailben

on:
  issues:
    types: [opened]
  discussion:
    types: [created]

permissions:
  contents: read
  issues: read
  discussions: read

jobs:
  issue-draft:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    environment:
      name: Github assistant
    steps:
      - name: Kötelező secretek ellenőrzése
        shell: bash
        env:
          AI_PROVIDER: ${{ vars.DRAFT_AI_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KNOWLEDGE_REPOSITORY_TOKEN: ${{ secrets.KNOWLEDGE_REPOSITORY_TOKEN }}
        run: |
          case "${AI_PROVIDER}" in
            groq)
              if [[ -z "${GROQ_API_KEY}" ]]; then
                echo "::error::A GROQ_API_KEY nem érhető el a Github assistant Environmentből."
                exit 1
              fi
              ;;
            openai)
              if [[ -z "${OPENAI_API_KEY}" ]]; then
                echo "::error::Az OPENAI_API_KEY nem érhető el a Github assistant Environmentből."
                exit 1
              fi
              ;;
            *)
              echo "::error::A DRAFT_AI_PROVIDER értéke csak groq vagy openai lehet."
              exit 1
              ;;
          esac
          if [[ -z "${KNOWLEDGE_REPOSITORY_TOKEN}" ]]; then
            echo "::error::A KNOWLEDGE_REPOSITORY_TOKEN nem érhető el a Github assistant Environmentből."
            exit 1
          fi
          echo "A kötelező secretek elérhetők."

      - name: Issue választervezet
        uses: renced42/github-answer-draft-assistant@main
        with:
          organization: nav-gov-hu
          event-kind: issue
          repository: ${{ github.repository }}
          number: ${{ github.event.issue.number }}
          title: ${{ github.event.issue.title }}
          body: ${{ github.event.issue.body }}
          question-url: ${{ github.event.issue.html_url }}
          author: ${{ github.event.issue.user.login }}
          email-to: ${{ vars.DRAFT_EMAIL_TO }}
          question-max-chars: ${{ vars.DRAFT_QUESTION_MAX_CHARS || '3000' }}
          ai-provider: ${{ vars.DRAFT_AI_PROVIDER || 'groq' }}
          groq-model: ${{ vars.DRAFT_GROQ_MODEL || 'openai/gpt-oss-120b' }}
          openai-model: ${{ vars.DRAFT_OPENAI_MODEL || 'gpt-5.4-mini' }}
          nav-gov-hu-search: "true"
          browser-search: "true"
          knowledge-repository: ${{ vars.KNOWLEDGE_REPOSITORY }}
          knowledge-approved-label: approved-knowledge
          knowledge-candidate-label: knowledge-candidate
          create-review-issue: "true"
          knowledge-limit: ${{ vars.KNOWLEDGE_LIMIT || '5' }}
        env:
          GITHUB_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KNOWLEDGE_REPOSITORY_TOKEN: ${{ secrets.KNOWLEDGE_REPOSITORY_TOKEN }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}

  discussion-draft:
    if: github.event_name == 'discussion'
    runs-on: ubuntu-latest
    environment:
      name: Github assistant
    steps:
      - name: Kötelező secretek ellenőrzése
        shell: bash
        env:
          AI_PROVIDER: ${{ vars.DRAFT_AI_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KNOWLEDGE_REPOSITORY_TOKEN: ${{ secrets.KNOWLEDGE_REPOSITORY_TOKEN }}
        run: |
          case "${AI_PROVIDER}" in
            groq)
              if [[ -z "${GROQ_API_KEY}" ]]; then
                echo "::error::A GROQ_API_KEY nem érhető el a Github assistant Environmentből."
                exit 1
              fi
              ;;
            openai)
              if [[ -z "${OPENAI_API_KEY}" ]]; then
                echo "::error::Az OPENAI_API_KEY nem érhető el a Github assistant Environmentből."
                exit 1
              fi
              ;;
            *)
              echo "::error::A DRAFT_AI_PROVIDER értéke csak groq vagy openai lehet."
              exit 1
              ;;
          esac
          if [[ -z "${KNOWLEDGE_REPOSITORY_TOKEN}" ]]; then
            echo "::error::A KNOWLEDGE_REPOSITORY_TOKEN nem érhető el a Github assistant Environmentből."
            exit 1
          fi
          echo "A kötelező secretek elérhetők."

      - name: Discussion választervezet
        uses: renced42/github-answer-draft-assistant@main
        with:
          organization: nav-gov-hu
          event-kind: discussion
          repository: ${{ github.repository }}
          number: ${{ github.event.discussion.number }}
          title: ${{ github.event.discussion.title }}
          body: ${{ github.event.discussion.body }}
          question-url: ${{ github.event.discussion.html_url }}
          author: ${{ github.event.discussion.user.login }}
          email-to: ${{ vars.DRAFT_EMAIL_TO }}
          question-max-chars: ${{ vars.DRAFT_QUESTION_MAX_CHARS || '3000' }}
          ai-provider: ${{ vars.DRAFT_AI_PROVIDER || 'groq' }}
          groq-model: ${{ vars.DRAFT_GROQ_MODEL || 'openai/gpt-oss-120b' }}
          openai-model: ${{ vars.DRAFT_OPENAI_MODEL || 'gpt-5.4-mini' }}
          nav-gov-hu-search: "true"
          browser-search: "true"
          knowledge-repository: ${{ vars.KNOWLEDGE_REPOSITORY }}
          knowledge-approved-label: approved-knowledge
          knowledge-candidate-label: knowledge-candidate
          create-review-issue: "true"
          knowledge-limit: ${{ vars.KNOWLEDGE_LIMIT || '5' }}
        env:
          GITHUB_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KNOWLEDGE_REPOSITORY_TOKEN: ${{ secrets.KNOWLEDGE_REPOSITORY_TOKEN }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
